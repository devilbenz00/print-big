name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp print-big.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native printing plugin
        run: |
          mkdir -p android/app/src/main/java/com/chekhoff/print
          cp RawPrintPlugin.java android/app/src/main/java/com/chekhoff/print/
          cp MainActivity.java android/app/src/main/java/com/chekhoff/print/

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher*.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: print-big-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
